[package]
name = "hotpaste"
version = "0.1.75"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "HotPaste-dev"

[[bin]]
name = "HotPaste"
path = "src/main.rs"

[[bin]]
name = "HotPaste-dev"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
window-vibrancy = "0.5"
raw-window-handle = "0.6"
base64 = "0.22"
md5 = "0.7"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

# ОНОВЛЕННЯ ВСТАНОВЛЕНОГО ЗАСТОСУНКУ.
#
# Доти каналу доставки не було ЖОДНОГО: фронтенд лежить усередині exe, а
# `deploy.yml` публікує лише веб-версію. Тобто будь-яка правка інтерфейсу
# доїжджала до людини рівно тоді, коли вона сама здогадалася перевстановити
# застосунок. Наявний `versionService.applyUpdateAndDeepClean()` при цьому
# кликав `relaunch()` — тобто перезапускав ТУ САМУ версію, ще й стерши
# налаштування.
#
# Налаштування плагіна (адреси й відкритий ключ) живуть НЕ тут, а в
# `tauri.conf.release.json` — див. пояснення в тому файлі.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
